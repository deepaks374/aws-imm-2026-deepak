name: Code-to-Cloud CNAPP Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required for code checkout
  security-events: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloudpulse-telemetry-engine
  EKS_CLUSTER_NAME: cloudpulse-cnapp-eks
  DEPLOYMENT_NAMESPACE: cloudpulse-core
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_URL: https://api-dsharma1.xdr.in.paloaltonetworks.com

jobs:
  # ============================================================================
  # STAGE 1: Code Verification & Unit Testing
  # ============================================================================
  test-and-lint:
    name: "01. Application Unit Testing"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Unit Test Suite
        run: |
          pytest test_app.py -v

  # ============================================================================
  # STAGE 2: Palo Alto Networks Cortex CLI Code Scan & SAST
  # Downloads the official unified cortexcli binary and executes SAST/Secrets/IaC scan
